<app-sheet-modal title="Write a review" (closed)="closed.emit()">
  <div class="option-group">
    <label for="review-game">Game</label>
    <select id="review-game" [ngModel]="gameId()" (ngModelChange)="gameId.set($event)">
      <option [ngValue]="null">— Select a game —</option>
      @for (game of games(); track game.id) {
        <option [ngValue]="game.id">{{ game.name }}</option>
      }
    </select>
  </div>

  <div class="chip-row" role="radiogroup" aria-label="Play status">
    <button type="button" class="chip" [class.active]="playStatus() === PlayStatus.Finished" (click)="playStatus.set(PlayStatus.Finished)">Finished</button>
    <button type="button" class="chip" [class.active]="playStatus() === PlayStatus.StillPlaying" (click)="playStatus.set(PlayStatus.StillPlaying)">Still playing</button>
    <button type="button" class="chip" [class.active]="playStatus() === PlayStatus.Dropped" (click)="playStatus.set(PlayStatus.Dropped)">Dropped</button>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="review-hours">Hours played <span class="text-muted">(self-reported)</span></label>
      <input
        id="review-hours"
        type="number"
        min="0"
        [ngModel]="hoursPlayed()"
        (ngModelChange)="hoursPlayed.set($event)"
        placeholder="e.g. 24">
    </div>

    <div class="form-group">
      <label for="review-score">Score (0-10)</label>
      <input
        id="review-score"
        type="number"
        min="0"
        max="10"
        [ngModel]="score()"
        (ngModelChange)="score.set($event)">
    </div>
  </div>

  <div class="score-preview">
    <app-star-rating [score]="score()" />
    <span class="text-muted">{{ score() }}/10</span>
  </div>

  <label class="checkbox-row">
    <input type="checkbox" [ngModel]="spoilerFree()" (ngModelChange)="spoilerFree.set($event)">
    Spoiler-free
  </label>

  <div class="form-group">
    <label for="review-headline">Headline</label>
    <input
      id="review-headline"
      type="text"
      [ngModel]="headline()"
      (ngModelChange)="headline.set($event)"
      [maxlength]="maxTitleLength"
      placeholder="Sum up your review in one line">
  </div>

  <div class="form-group">
    <label for="review-body">Review</label>
    <textarea
      id="review-body"
      rows="6"
      [ngModel]="body()"
      (ngModelChange)="body.set($event)"
      [maxlength]="maxBodyLength"
      placeholder="What did you think?"></textarea>
    <span class="char-count">{{ body().length }}/{{ maxBodyLength }}</span>
  </div>

  @if (errorMessage()) {
    <p class="form-error">{{ errorMessage() }}</p>
  }

  <div class="composer-footer">
    <button type="button" class="btn btn-primary" [disabled]="isSubmitting()" (click)="submit()">
      {{ isSubmitting() ? 'Publishing...' : 'Publish review' }}
    </button>
  </div>
</app-sheet-modal>
