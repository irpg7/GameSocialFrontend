<div class="sheet-backdrop" appBackdropClose (backdropClose)="closed.emit()">
  <div
    class="sheet-panel"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    appDialog
    dialogInitialFocus="input, textarea, select, [role=tab]"
    (dialogEscape)="closed.emit()"
    (click)="$event.stopPropagation()">
    <div class="sheet-header">
      <div class="sheet-heading">
        <h3>{{ title() }}</h3>
        @if (subtitle(); as sub) {
          <p class="sheet-subtitle">{{ sub }}</p>
        }
      </div>
      <button type="button" class="sheet-close" aria-label="Close" (click)="closed.emit()">&#10005;</button>
    </div>
    <div class="sheet-body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
