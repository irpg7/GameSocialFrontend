<div class="admin-page">
  <header class="admin-head">
    <div>
      <h1>Settings</h1>
      <p class="admin-sub">Application-wide configuration values.</p>
    </div>
  </header>

  @if (isLoading()) {
    <p class="admin-empty">Loading settings…</p>
  } @else {
    <div class="table-wrapper card">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Key</th>
            <th>Value</th>
            <th>Description</th>
            <th><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody>
          @for (rowField of rowsForm; track $index) {
            @let row = rowField().value();
            <tr>
              <td class="mono setting-key">{{ row.key }}</td>
              <td>
                <input type="text" [attr.aria-label]="row.key" [formField]="rowField.value">
              </td>
              <td class="text-muted">{{ row.description }}</td>
              <td class="admin-table-actions">
                <button
                  type="button"
                  class="btn btn-primary btn-sm row-save"
                  [disabled]="row.isSaving || row.value === row.savedValue"
                  (click)="save(row.key)">
                  {{ row.isSaving ? 'Saving...' : 'Save' }}
                </button>
              </td>
            </tr>
          }

          @if (rows().length === 0) {
            <tr>
              <td colspan="4" class="admin-empty-cell">No settings found.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
