<div class="admin-page">
  <h1>Settings</h1>
  <p class="text-muted mb-lg">Application-wide configuration values.</p>

  @if (isLoading()) {
    <p class="text-muted">Loading settings...</p>
  } @else {
    <div class="table-wrapper card">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Key</th>
            <th>Value</th>
            <th>Description</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (rowField of rowsForm; track $index) {
            @let row = rowField().value();
            <tr>
              <td>{{ row.key }}</td>
              <td>
                <input type="text" [attr.aria-label]="row.key" [formField]="rowField.value">
              </td>
              <td class="text-muted">{{ row.description }}</td>
              <td class="admin-table-actions">
                <button
                  type="button"
                  class="btn btn-primary btn-sm"
                  [disabled]="row.isSaving || row.value === row.savedValue"
                  (click)="save(row.key)">
                  {{ row.isSaving ? 'Saving...' : 'Save' }}
                </button>
              </td>
            </tr>
          }

          @if (rows().length === 0) {
            <tr>
              <td colspan="4" class="text-muted">No settings found.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
