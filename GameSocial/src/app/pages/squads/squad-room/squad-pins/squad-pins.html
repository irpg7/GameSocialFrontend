<div class="tab-panel">
  @if (isLoading() && guides().length === 0) {
    <p class="tab-status">Guide'lar yükleniyor…</p>
  } @else {
    @if (featured(); as guide) {
      <!-- 05-squad.html L183: featured PINNED guide -->
      <button type="button" class="guide-featured" (click)="openGuide.emit(guide)">
        <span class="guide-cover">
          <img [appImg]="guide.coverUrl" fallback="game" alt="" />
        </span>
        <span class="guide-featured-body">
          <span class="guide-featured-head">
            <span class="guide-badge mono">PINNED</span>
            <span class="guide-byline">{{ guide.createdByUsername }} · updated {{ updated(guide.updatedAt) }}</span>
          </span>
          <span class="guide-title">{{ guide.title }}</span>
          @if (guide.description) {
            <span class="guide-desc">{{ guide.description }}</span>
          }
          <span class="guide-chips">
            @if (guide.clipCount > 0) {
              <span class="guide-chip">{{ guide.clipCount }} clip{{ guide.clipCount === 1 ? '' : 's' }}</span>
            }
            @if (guide.screenCount > 0) {
              <span class="guide-chip">{{ guide.screenCount }} screen{{ guide.screenCount === 1 ? '' : 's' }}</span>
            }
            @if (guide.gameName) {
              <span class="guide-chip">{{ guide.gameName }}</span>
            }
          </span>
        </span>
      </button>
    }

    <ul class="guide-rows">
      @for (guide of rest(); track guide.id) {
        <li>
          <button type="button" class="guide-row" (click)="openGuide.emit(guide)">
            <span class="guide-row-thumb">
              <img [appImg]="guide.coverUrl" fallback="game" alt="" />
            </span>
            <span class="guide-row-body">
              <span class="guide-row-title">{{ guide.title }}</span>
              <span class="guide-row-meta">{{ guide.createdByUsername }} · {{ assets(guide) }}</span>
            </span>
            <span class="guide-row-open">Open</span>
          </button>
        </li>
      }
      @if (canCreate()) {
        <li>
          <button type="button" class="guide-dashed" (click)="createGuide.emit()">＋ Pin a guide from #{{ channelName() }}</button>
        </li>
      }
    </ul>
  }
</div>
