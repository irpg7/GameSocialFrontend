<div class="games-container">
  <div class="games-header">
    <div>
      <h1>Games</h1>
      <p class="text-muted">Browse and follow your favourite games</p>
    </div>
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
        placeholder="Search by name...">
    </div>
  </div>

  <div class="games-grid" *ngIf="filteredGames.length > 0">
    <div class="game-card card" *ngFor="let game of filteredGames">
      <div class="game-cover">
        <img *ngIf="game.coverImageUrl" [src]="game.coverImageUrl" [alt]="game.name" />
        <div *ngIf="!game.coverImageUrl" class="game-cover-placeholder">🎮</div>
      </div>
      <div class="game-info">
        <h3>{{ game.name }}</h3>
        <span class="game-slug text-muted">{{ game.slug }}</span>
      </div>
      <button class="btn btn-secondary" type="button" disabled title="Follow — coming soon">Follow</button>
    </div>
  </div>

  <div *ngIf="filteredGames.length === 0" class="no-results">
    <p class="text-muted">No games found for "<strong>{{ searchQuery }}</strong>"</p>
  </div>
</div>
