<div class="queue-card" (click)="play.emit()" (mouseenter)="onEnter()" (mouseleave)="onLeave()">
  <button type="button" class="queue-main" [attr.aria-label]="'Oynat: ' + title()" (click)="onPlay($event)" (focus)="onEnter()" (blur)="onLeave()">
    <span class="queue-thumb">
      <video #video class="queue-video" [src]="src()" [attr.poster]="poster()" muted playsinline preload="metadata" (timeupdate)="onPreviewTime()"></video>

      @if (!previewing() && !active()) {
        <span class="queue-play" aria-hidden="true">▶</span>
      }
      @if (previewing()) {
        <span class="queue-preview-badge"><span class="queue-preview-dot" aria-hidden="true"></span>ÖN İZLEME · 🔇</span>
      }

      <span class="queue-time">{{ timeLabel() }}</span>
      <span class="queue-progress" aria-hidden="true"><span class="queue-progress-fill" [style.width.%]="progressPercent()"></span></span>
    </span>

    <span class="queue-body">
      <span class="queue-title">{{ title() }}</span>
    </span>
  </button>

  <div class="queue-author-row">
    <span class="queue-avatar" aria-hidden="true">
      <img [appImg]="post().authorAvatarUrl" fallback="avatar" alt="" />
    </span>
    <span class="queue-author">{{ post().username }}</span>
    <button
      type="button"
      class="queue-save"
      [class.saved]="saved()"
      [attr.aria-pressed]="saved()"
      [attr.aria-label]="saved() ? 'Kaydedildi' : 'Kaydet'"
      [disabled]="isTogglingSave()"
      (click)="toggleSave($event)">{{ saved() ? '◆' : '◇' }}</button>
  </div>

  <div class="queue-stats">
    <button type="button" class="queue-chip queue-vote" [class.active]="liked()" [attr.aria-pressed]="liked()" [disabled]="isTogglingLike()" (click)="toggleLike($event)">
      ▲ {{ likeLabel() }}
    </button>
    <button type="button" class="queue-chip" [attr.aria-label]="'Yorumlar: ' + commentCount()" (click)="onOpenComments($event)">💬 {{ commentCount() }}</button>
  </div>
</div>
